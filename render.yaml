services:
  - type: web
    name: timetable-manager
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3000
      - key: SQLITE_PATH
        value: /data/timetable.db
    disk:
      name: timetable-data
      mountPath: /data
      sizeGB: 1